<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统</title>
    <style>
        /* --- 基础样式 (保持之前的精美设计) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 900px; /* 加宽一点以容纳表格 */
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #333; font-size: 2.5rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- 按钮样式 --- */
        .btn-group { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-weight: bold;
            min-width: 150px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(1px); }

        .btn-student { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .btn-grade { background: linear-gradient(45deg, #1FA2FF, #12D8FA, #A6FFCB); color: #333; }
        .btn-course { background: linear-gradient(45deg, #F09819, #EDDE5D); color: #333; }

        /* --- 表格区域样式 (新增) --- */
        #content-area {
            margin-top: 30px;
            text-align: left;
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .table-container {
            max-height: 400px; /* 限制高度，内容多时出现滚动条 */
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f1f1f1; }
        
        /* 关闭按钮 */
        .close-btn {
            display: block;
            margin: 0 auto 15px auto;
            background: transparent;
            border: 1px solid #ccc;
            color: #666;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .close-btn:hover { background: #eee; }

    </style>
</head>
<body>

<div class="container">
    <h1>班级管理系统</h1>
    
    <div class="btn-group">
        <!-- 给第一个按钮添加点击事件 -->
        <button class="btn btn-student" onclick="showStudentTable()">学生管理</button>
        <button class="btn btn-grade" onclick="toggleLottery()">抽签工具</button>
        <button class="btn btn-course" onclick="alert('课程管理功能开发中...')">课程管理</button>
    </div>
    <!-- === 替换原有的 lottery-container 内容 === -->
<div id="lottery-container" style="display: none; margin-top: 20px; text-align: center;">
    
    <!-- 1. 输入区域 -->
    <div style="margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 10px;">
        <h3 style="color:#555; margin-bottom:10px;">设置转盘名单</h3>
        <input type="text" id="name-input" placeholder="输入同学名字 (例如: 张三)" 
               style="padding: 8px; width: 200px; border: 1px solid #ddd; border-radius: 5px;">
        <button onclick="addName()" style="padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">添加</button>
        
        <!-- 显示当前已添加的名字 -->
        <div id="name-list-display" style="margin-top: 10px; color: #666; font-size: 0.9em; min-height: 20px;">
            (当前名单为空)
        </div>
    </div>

    <!-- 2. 转盘区域 -->
    <div style="position: relative; width: 300px; height: 300px; margin: 0 auto;">
        <!-- 点击 Canvas 即可开始旋转 -->
        <canvas id="wheel-canvas" width="300" height="300" 
                onclick="startSpin()" 
                style="cursor: pointer; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);">
        </canvas>
        <!-- 红色指针 -->
        <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff4757; z-index: 10;"></div>
    </div>

    <!-- 3. 结果展示区域 -->
    <div style="margin-top: 30px;">
        <h2 style="color: #333;">🎉 幸运儿是：</h2>
        <div id="winner-result" style="font-size: 3em; color: #ff4757; font-weight: bold; margin-top: 10px; min-height: 1.2em;">
            ?
        </div>
    </div>
</div>
    <!-- 这里是用来显示表格的区域 -->
    <div id="content-area">
        <button class="close-btn" onclick="hideContent()">收起表格</button>
        <div class="table-container">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>年级</th>
                        <th>班级</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 数据将通过 JS 插入这里 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

    ];

    // 2. 显示表格的函数
    function showStudentTable() {
        const contentArea = document.getElementById('content-area');
        const tableBody = document.getElementById('table-body');
        
        // 清空旧数据（防止重复点击累加）
        tableBody.innerHTML = '';

        // 循环生成表格行
        students.forEach(student => {
            const row = `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.sno}</td>
                    <td>${student.name}</td>
                    <td>${student.gender}</td>
                    <td>${student.grade}</td>
                    <td>${student.cls}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        // 显示区域
        contentArea.style.display = 'block';
    }

    // 3. 隐藏表格的函数
    function hideContent() {
        document.getElementById('content-area').style.display = 'none';
    }
        // ==========================================
      // ==========================================
    // 新增：自定义名单抽签逻辑
    // ==========================================

    // 存储名字的数组
    let lotteryNames = []; 
    let currentRotation = 0; // 记录当前的旋转角度

    // 1. 切换显示/隐藏抽签区域
    function toggleLottery() {
        const container = document.getElementById('lottery-container');
        const table = document.getElementById('content-area'); // 假设表格容器ID是这个

        if (container.style.display === 'none') {
            container.style.display = 'block';
            if(table) table.style.display = 'none'; // 互斥显示
            drawWheel(); // 显示时重绘转盘
        } else {
            container.style.display = 'none';
        }
    }

    // 2. 添加名字功能
    function addName() {
        const input = document.getElementById('name-input');
        const name = input.value.trim();

        if (name) {
            lotteryNames.push(name); // 加入数组
            input.value = ''; // 清空输入框
            updateNameList(); // 更新下方列表显示
            drawWheel();      // 重绘转盘
        } else {
            alert("请输入名字！");
        }
    }

    // 更新名字列表显示
    function updateNameList() {
        const listDiv = document.getElementById('name-list-display');
        if (lotteryNames.length === 0) {
            listDiv.innerText = "(当前名单为空)";
        } else {
            listDiv.innerText = "名单: " + lotteryNames.join("、");
        }
    }

    // 3. 绘制转盘 (核心绘图逻辑)
    function drawWheel() {
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = width / 2;

        ctx.clearRect(0, 0, width, height); // 清空画布

        if (lotteryNames.length === 0) {
            // 如果没名字，画个灰色的圈
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = "#eee";
            ctx.fill();
            ctx.fillStyle = "#999";
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText("请输入名字", centerX, centerY);
            return;
        }

        const step = (2 * Math.PI) / lotteryNames.length; // 每个扇形的弧度

        // 颜色盘 (循环使用)
        const colors = ['#FFD700', '#FF6347', '#87CEEB', '#98FB98', '#DDA0DD', '#F0E68C'];

        for (let i = 0; i < lotteryNames.length; i++) {
            // 画扇形
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, i * step, (i + 1) * step);
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.stroke();

            // 画文字
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(i * step + step / 2); // 旋转到扇形中间
            ctx.textAlign = "right";
            ctx.fillStyle = "#333";
            ctx.font = "bold 16px Arial";
            ctx.fillText(lotteryNames[i], radius - 20, 5); // 文字位置
            ctx.restore();
        }
    }

    // 4. 开始旋转 (点击触发)
    function startSpin() {
        if (lotteryNames.length < 2) {
            alert("请至少输入两个名字才能开始抽签！");
            return;
        }

        const canvas = document.getElementById('wheel-canvas');
        const resultDiv = document.getElementById('winner-result');
        
        resultDiv.innerText = "旋转中...";

        // 随机旋转圈数 (5到10圈) + 随机角度
        const randomSpins = 360 * (5 + Math.random() * 5); 
        const randomDegree = Math.floor(Math.random() * 360);
        
        // 累加旋转角度，保证每次都顺滑接着转
        currentRotation += randomSpins + randomDegree;

        // 使用 CSS transform 进行旋转动画
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // 计算结果 (等待动画结束，这里假设 CSS transition 是 4秒)
        setTimeout(() => {
            calculateWinner(currentRotation);
        }, 4000); 
    }

    // 5. 计算谁是幸运儿
    function calculateWinner(rotation) {
        // 规范化角度到 0-360
        const actualRotation = rotation % 360;
        
        // 指针在上方(270度位置)，Canvas 0度在右方(3点钟)。
        // 这是一个数学换算，算出指针落在了哪个扇形索引上
        // 这里的逻辑：指针不动，盘在转。
        // 简单算法：(360 - 实际角度 + 偏移量) % 360
        
        // 修正逻辑：CSS旋转是顺时针。
        // 0度在右边。指针在上方(相当于逆时针90度，或270度)。
        // 实际上我们只需要算出相对位移。
        
        const sliceSize = 360 / lotteryNames.length;
        
        // 这里的 270 是因为指针在正上方，而 Canvas 的 0 度在正右方
        // 需要加上 270 度来对齐指针位置，再取余
        let index = Math.floor(((360 - actualRotation + 270) % 360) / sliceSize);
        
        // 防止索引越界
        index = index % lotteryNames.length;

        const winner = lotteryNames[index];
        document.getElementById('winner-result').innerText = winner;
        
        // 简单的庆祝效果
        alert(`恭喜 ${winner} 被抽中！`);
    }
