<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统</title>
    <style>
        /* --- 基础样式 (保持之前的精美设计) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 900px; /* 加宽一点以容纳表格 */
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #333; font-size: 2.5rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- 按钮样式 --- */
        .btn-group { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-weight: bold;
            min-width: 150px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(1px); }

        .btn-student { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .btn-grade { background: linear-gradient(45deg, #1FA2FF, #12D8FA, #A6FFCB); color: #333; }
        .btn-course { background: linear-gradient(45deg, #F09819, #EDDE5D); color: #333; }

        /* --- 表格区域样式 (新增) --- */
        #content-area {
            margin-top: 30px;
            text-align: left;
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .table-container {
            max-height: 400px; /* 限制高度，内容多时出现滚动条 */
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f1f1f1; }
        
        /* 关闭按钮 */
        .close-btn {
            display: block;
            margin: 0 auto 15px auto;
            background: transparent;
            border: 1px solid #ccc;
            color: #666;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .close-btn:hover { background: #eee; }

    </style>
</head>
<body>

<div class="container">
    <h1>班级管理系统</h1>
    
    <div class="btn-group">
        <!-- 给第一个按钮添加点击事件 -->
        <button class="btn btn-student" onclick="showStudentTable()">学生管理</button>
        <button class="btn btn-grade" onclick="alert('成绩管理功能开发中...')">成绩管理</button>
        <button class="btn btn-course" onclick="alert('课程管理功能开发中...')">课程管理</button>
    </div>

    <!-- 这里是用来显示表格的区域 -->
    <div id="content-area">
        <button class="close-btn" onclick="hideContent()">收起表格</button>
        <div class="table-container">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>年级</th>
                        <th>班级</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 数据将通过 JS 插入这里 -->
                </tbody>
            </table>
        </div>
    </div>
</div>
