<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级管理系统</title>
<style>
  /* 全局样式重置与设置 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /* 主容器卡片样式 */
  .container {
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    padding: 40px;
    width: 100%;
    max-width: 600px;
    text-align: center;
    transition: transform 0.3s ease;
  }

  .container:hover {
    transform: translateY(-5px);
  }

  /* 标题样式 */
  h1 {
    font-size: 3.2em;
    font-weight: 800;
    color: #2d3748;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
  }

  /* 按钮容器，使用网格布局 */
  .button-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  /* 按钮通用样式 */
  .btn {
    padding: 14px 20px;
    font-size: 1.1em;
    font-weight: 600;
    text-transform: uppercase;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }

  /* 按钮悬停和点击效果 */
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(0, 0, 0, 0.2);
  }

  .btn:active {
    transform: translateY(1px);
  }

  /* 不同按钮的颜色 */
  .btn-primary {
    background-color: #4c6ef5;
    color: white;
  }

  .btn-primary:hover {
    background-color: #3a56d9;
  }

  .btn-secondary {
    background-color: #f06595;
    color: white;
  }

  .btn-secondary:hover {
    background-color: #d94f7a;
  }

  .btn-tertiary {
    background-color: #22b8cf;
    color: white;
  }

  .btn-tertiary:hover {
    background-color: #1aa9b9;
  }

  /* 响应式调整 */
  @media (max-width: 480px) {
    .container {
      padding: 30px 20px;
    }

    h1 {
      font-size: 2.5em;
    }

    .btn {
      padding: 12px 15px;
      font-size: 1em;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>班级管理系统</h1>
  <p style="color: #4a5568; font-size: 1.1em; margin-bottom: 20px;">一个简洁高效的管理平台，助您轻松管理班级事务。</p >
  
  <div class="button-container">
    <button class="btn btn-primary" onclick="alert('功能开发中：学生管理')">学生管理</button>
    <button class="btn btn-secondary" onclick="alert('功能开发中：成绩管理')">成绩管理</button>
    <button class="btn btn-tertiary" onclick="alert('功能开发中：课程管理')">课程管理</button>
  </div>
</div>

</body>
</html>
