<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统</title>
    <style>
        /* --- 基础样式 (保持之前的精美设计) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 900px; /* 加宽一点以容纳表格 */
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #333; font-size: 2.5rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- 按钮样式 --- */
        .btn-group { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-weight: bold;
            min-width: 150px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(1px); }

        .btn-student { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .btn-grade { background: linear-gradient(45deg, #1FA2FF, #12D8FA, #A6FFCB); color: #333; }
        .btn-course { background: linear-gradient(45deg, #F09819, #EDDE5D); color: #333; }

        /* --- 表格区域样式 (新增) --- */
        #content-area {
            margin-top: 30px;
            text-align: left;
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .table-container {
            max-height: 400px; /* 限制高度，内容多时出现滚动条 */
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f1f1f1; }
        
        /* 关闭按钮 */
        .close-btn {
            display: block;
            margin: 0 auto 15px auto;
            background: transparent;
            border: 1px solid #ccc;
            color: #666;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .close-btn:hover { background: #eee; }

    </style>
</head>
<body>

<div class="container">
    <h1>班级管理系统</h1>
    
    <div class="btn-group">
        <!-- 给第一个按钮添加点击事件 -->
        <button class="btn btn-student" onclick="showStudentTable()">学生管理</button>
        <button class="btn btn-grade" onclick="toggleLottery()">抽签工具</button>
        <button class="btn btn-course" onclick="alert('课程管理功能开发中...')">课程管理</button>
    </div>
    <!-- === 替换原有的 lottery-container 内容 === -->
<div id="lottery-container" style="display: none; margin-top: 20px; text-align: center;">
    
    <!-- 1. 输入区域 -->
    <div style="margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 10px;">
        <h3 style="color:#555; margin-bottom:10px;">设置转盘名单</h3>
        <input type="text" id="name-input" placeholder="输入同学名字 (例如: 张三)" 
               style="padding: 8px; width: 200px; border: 1px solid #ddd; border-radius: 5px;">
        <button onclick="addName()" style="padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">添加</button>
        
        <!-- 显示当前已添加的名字 -->
        <div id="name-list-display" style="margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <!-- 名字标签会动态生成在这里 -->
        </div>
    </div>

    <!-- 2. 转盘区域 -->
    <div style="position: relative; width: 300px; height: 300px; margin: 0 auto;">
        <!-- 指针 -->
        <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff4757; z-index: 10;"></div>
        <!-- 画布 -->
        <canvas id="wheel-canvas" width="300" height="300" style="cursor: pointer; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.2);"></canvas>
    </div>

    <!-- 3. 结果展示 -->
    <div id="winner-display" style="margin-top: 20px; font-size: 24px; font-weight: bold; color: #ff4757; height: 40px;"></div>
</div>
    <!-- 这里是用来显示表格的区域 -->
    <div id="content-area">
        <button class="close-btn" onclick="hideContent()">收起表格</button>
        <div class="table-container">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>年级</th>
                        <th>班级</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 数据将通过 JS 插入这里 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>

        { sno: "202485013036", name: "袁佳乐", gender: "男", grade: "2024", cls: "网安24-1" },
        { sno: "202485013037", name: "肖佳城", gender: "男", grade: "2024", cls: "网安24-1" },
        { sno: "202485013038", name: "郭志翔", gender: "男", grade: "2024", cls: "网安24-1" },

        { sno: "202485013040", name: "王中鸣", gender: "男", grade: "2024", cls: "网安24-1" }
    ];

    // 2. 显示表格的函数
    function showStudentTable() {
        const contentArea = document.getElementById('content-area');
        const tableBody = document.getElementById('table-body');
        
        // 清空旧数据（防止重复点击累加）
        tableBody.innerHTML = '';

        // 循环生成表格行
        students.forEach(student => {
            const row = `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.sno}</td>
                    <td>${student.name}</td>
                    <td>${student.gender}</td>
                    <td>${student.grade}</td>
                    <td>${student.cls}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        // 显示区域
        contentArea.style.display = 'block';
    }

    // 3. 隐藏表格的函数
    function hideContent() {
        document.getElementById('content-area').style.display = 'none';
    }
    // ==========================================
    // 新增：抽签工具逻辑代码 (从下面开始复制)
    // ==========================================

    // 存储名单的数组
    let lotteryNames = []; 
    // 控制旋转状态
    let isSpinning = false; 

    // 1. 切换显示/隐藏抽签区域
    function toggleLottery() {
        const lotteryContainer = document.getElementById('lottery-container');
        const contentArea = document.getElementById('content-area');
        
        if (contentArea.style.display === 'block') {
            contentArea.style.display = 'none';
        }

        if (lotteryContainer.style.display === 'none') {
            lotteryContainer.style.display = 'block';
            drawWheel(); // 每次打开都重绘一下，防止空白
        } else {
            lotteryContainer.style.display = 'none';
        }
    }

    // 2. 添加名字
    function addName() {
        const input = document.getElementById('name-input');
        const name = input.value.trim();
        
        if (name) {
            lotteryNames.push(name);
            input.value = ''; // 清空输入框
            updateNameListDisplay(); // 更新下方列表显示
            drawWheel(); // 重绘转盘
        } else {
            alert("请输入名字！");
        }
    }

    // 3. 删除名字 (通过索引删除)
    function removeName(index) {
        lotteryNames.splice(index, 1);
        updateNameListDisplay();
        drawWheel();
    }

    // 4. 更新名字列表的显示 (生成带删除按钮的标签)
    function updateNameListDisplay() {
        const listDiv = document.getElementById('name-list-display');
        listDiv.innerHTML = ''; // 清空旧内容

        lotteryNames.forEach((name, index) => {
            // 创建每个名字的容器
            const tag = document.createElement('span');
            tag.style.cssText = "background: #e0e7ff; color: #333; padding: 5px 10px; border-radius: 15px; font-size: 14px; display: flex; align-items: center; gap: 5px;";
            
            // 名字文本
            const textSpan = document.createElement('span');
            textSpan.innerText = name;
            
            // 删除按钮 (小叉号)
            const closeBtn = document.createElement('span');
            closeBtn.innerText = '×';
            closeBtn.style.cssText = "cursor: pointer; color: #ff4757; font-weight: bold; font-size: 16px;";
            closeBtn.onclick = function() { removeName(index); }; // 绑定删除事件

            tag.appendChild(textSpan);
            tag.appendChild(closeBtn);
            listDiv.appendChild(tag);
        });
    }

    // 5. 绘制转盘
    function drawWheel() {
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = width / 2 - 10; // 留一点边距

        ctx.clearRect(0, 0, width, height); // 清空画布

        if (lotteryNames.length === 0) {
            // 如果没名字，画个灰色圆
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#eee';
            ctx.fill();
            ctx.fillStyle = '#999';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("请在上方添加名字", centerX, centerY);
            return;
        }

        const step = (2 * Math.PI) / lotteryNames.length;
        const colors = ['#FFC0CB', '#87CEFA', '#98FB98', '#FFD700', '#DDA0DD', '#F0E68C']; // 随机配色池

        for (let i = 0; i < lotteryNames.length; i++) {
            // 画扇形
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, i * step, (i + 1) * step);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.stroke();

            // 画文字
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(i * step + step / 2); // 旋转到扇形中心
            ctx.textAlign = "right";
            ctx.fillStyle = "#333";
            ctx.font = "bold 16px Arial";
            ctx.fillText(lotteryNames[i], radius - 20, 5); // 文字位置
            ctx.restore();
        }
    }

    // 6. 点击转盘开始抽奖
    document.getElementById('wheel-canvas').addEventListener('click', function() {
        if (isSpinning || lotteryNames.length === 0) return; // 正在转或没名字时不响应
        
        isSpinning = true;
        const winnerDiv = document.getElementById('winner-display');
        winnerDiv.innerText = "抽奖中...";

        // 简单的旋转动画逻辑
        let speed = 20 + Math.random() * 10; // 初始速度
        let rotation = 0;
        const canvas = document.getElementById('wheel-canvas');
        
        function animate() {
            rotation += speed;
            speed *= 0.98; // 慢慢减速
            
            // 旋转画布本身
            canvas.style.transform = `rotate(${rotation}deg)`;

            if (speed < 0.1) {
                // 停止
                isSpinning = false;
                canvas.style.transform = `rotate(${rotation}deg)`;
                
                // 计算结果 (注意：指针在上方，即 -90度 或 270度位置，需要数学换算)
                // 简化算法：直接取模计算最终角度对应的索引
                const finalAngle = rotation % 360;
                // 指针在顶部(270度/ -90度)，画布顺时针转。
                // 这是一个简化的近似计算，为了演示效果：
                const index = Math.floor(((360 - finalAngle + 270) % 360) / (360 / lotteryNames.length));
                
                // 修正索引范围
                let winningIndex = index % lotteryNames.length;
                
                winnerDiv.innerText = "🎉 恭喜：" + lotteryNames[winningIndex] + " 🎉";
            } else {
                requestAnimationFrame(animate);
            }
        }
        animate();
    });
</script>

</html>
