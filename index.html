<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统</title>
    <style>
        /* --- 基础样式 (保持之前的精美设计) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 900px; /* 加宽一点以容纳表格 */
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #333; font-size: 2.5rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- 按钮样式 --- */
        .btn-group { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            font-weight: bold;
            min-width: 150px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(1px); }

        .btn-student { background: linear-gradient(45deg, #FF512F, #DD2476); }
        .btn-grade { background: linear-gradient(45deg, #1FA2FF, #12D8FA, #A6FFCB); color: #333; }
        .btn-course { background: linear-gradient(45deg, #F09819, #EDDE5D); color: #333; }

        /* --- 表格区域样式 (新增) --- */
        #content-area {
            margin-top: 30px;
            text-align: left;
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .table-container {
            max-height: 400px; /* 限制高度，内容多时出现滚动条 */
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f1f1f1; }
        
        /* 关闭按钮 */
        .close-btn {
            display: block;
            margin: 0 auto 15px auto;
            background: transparent;
            border: 1px solid #ccc;
            color: #666;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .close-btn:hover { background: #eee; }

    </style>
</head>
<body>

<div class="container">
    <h1>班级管理系统</h1>
    
    <div class="btn-group">
        <!-- 给第一个按钮添加点击事件 -->

        <button class="btn btn-grade" onclick="toggleLottery()">抽签工具</button>
        <button class="btn btn-course" onclick="alert('课程管理功能开发中...')">课程管理</button>
    </div>
    <!-- === 新增：抽签工具区域 (默认隐藏) === -->
    <div id="lottery-container" style="display: none; margin-top: 30px; text-align: center;">
        <h2 style="color: #333; margin-bottom: 20px;">幸运大转盘</h2>
        
        <!-- 转盘画布 -->
        <div style="position: relative; width: 300px; height: 300px; margin: 0 auto;">
            <canvas id="wheel-canvas" width="300" height="300" style="cursor: pointer; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.2);"></canvas>
            <!-- 指针 -->
            <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff4757; z-index: 10;"></div>
        </div>

        <!-- 结果展示框 -->
        <div style="margin-top: 30px;">
            <p style="font-size: 1.2em; color: #666;">被抽中的同学是：</p >
            <div id="winner-display" style="font-size: 2.5em; font-weight: bold; color: #ff4757; min-height: 60px; margin-top: 10px;">?</div>
        </div>
        
        <button onclick="startSpin()" style="margin-top: 20px; padding: 10px 30px; font-size: 1.2em; background: #2ed573; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);">开始抽签</button>
    </div>
    <!-- === 新增结束 === -->
    <!-- 这里是用来显示表格的区域 -->
    <div id="content-area">
        <button class="close-btn" onclick="hideContent()">收起表格</button>
        <div class="table-container">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>年级</th>
                        <th>班级</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 数据将通过 JS 插入这里 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

    // 2. 显示表格的函数
    function showStudentTable() {
        const contentArea = document.getElementById('content-area');
        const tableBody = document.getElementById('table-body');
        
        // 清空旧数据（防止重复点击累加）
        tableBody.innerHTML = '';

        // 循环生成表格行
        students.forEach(student => {
            const row = `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.sno}</td>
                    <td>${student.name}</td>
                    <td>${student.gender}</td>
                    <td>${student.grade}</td>
                    <td>${student.cls}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        // 显示区域
        contentArea.style.display = 'block';
    }

    // 3. 隐藏表格的函数
    function hideContent() {
        document.getElementById('content-area').style.display = 'none';
    }
        // ==========================================
    // 新增：抽签工具逻辑代码 (从下面开始复制)
    // ==========================================

    // 1. 切换显示/隐藏抽签区域
    function toggleLottery() {
        const lotteryContainer = document.getElementById('lottery-container');
        const contentArea = document.getElementById('content-area');
        
        // 如果表格正在显示，先隐藏表格
        if (contentArea.style.display === 'block') {
            contentArea.style.display = 'none';
        }

        // 切换抽签区域的显示状态
        if (lotteryContainer.style.display === 'none') {
            lotteryContainer.style.display = 'block';
            drawWheel(); // 显示时绘制转盘
        } else {
            lotteryContainer.style.display = 'none';
        }
    }

    // 2. 绘制转盘
    function drawWheel() {
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = width / 2 - 10; // 留一点边距
        
        const numStudents = students.length;
        const arc = Math.PI * 2 / numStudents; // 每个扇形的角度

        ctx.clearRect(0, 0, width, height); // 清空画布

        // 绘制扇形
        for (let i = 0; i < numStudents; i++) {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#FFDEAD' : '#87CEFA'; // 交替颜色
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arc);
            ctx.lineTo(centerX, centerY);
            ctx.fill();
            
            // 绘制文字（名字）
            ctx.save();
            ctx.fillStyle = '#333';
            ctx.font = '10px Arial'; // 名字太多，字体设小一点
            ctx.translate(centerX + Math.cos(angle + arc / 2) * (radius * 0.7), 
                          centerY + Math.sin(angle + arc / 2) * (radius * 0.7));
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            const text = students[i].name;
            ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
            ctx.restore();
        }
    }

    // 3. 开始旋转抽奖
    let isSpinning = false;
    function spinWheel() {
        if (isSpinning) return; // 防止重复点击
        isSpinning = true;

        const canvas = document.getElementById('wheel-canvas');
        let rotation = 0;
        // 随机旋转圈数 (5到10圈) + 随机角度
        const totalRotation = 360 * (5 + Math.random() * 5) + Math.random() * 360; 
        const duration = 4000; // 旋转时间 4秒
        const startTime = performance.now();

        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            if (elapsed < duration) {
                // 缓动效果 (Ease Out)
                const progress = elapsed / duration;
                const easeOut = 1 - Math.pow(1 - progress, 3); 
                
                rotation = totalRotation * easeOut;
                canvas.style.transform = `rotate(${rotation}deg)`;
                requestAnimationFrame(animate);
            } else {
                // 动画结束
                canvas.style.transform = `rotate(${totalRotation}deg)`;
                isSpinning = false;
                calculateWinner(totalRotation);
            }
        }
        requestAnimationFrame(animate);
    }

    // 4. 计算中奖者并显示
    function calculateWinner(rotation) {
        // 规范化角度到 0-360
        const actualRotation = rotation % 360;
        
        // Canvas 0度在右边(3点钟)，CSS旋转是顺时针。
        // 指针在上方(270度/-90度位置)。
        // 计算哪个扇形停在上方。
        // 这是一个简化的计算逻辑：
        const sliceAngle = 360 / students.length;
        
        // 计算索引 (注意方向修正)
        let index = Math.floor((360 - (actualRotation % 360) + 90) % 360 / sliceAngle);
        index = index % students.length; // 确保不越界
        
        const winner = students[index];
        
        // 显示结果
        const winnerBox = document.getElementById('winner-box');
        winnerBox.innerText = `${winner.name} (${winner.sno})`;
        winnerBox.style.color = '#ff4757';
        winnerBox.style.animation = 'pop 0.5s ease'; // 简单的弹跳动画效果
    }

    // 绑定点击事件给转盘
    document.getElementById('wheel-canvas').addEventListener('click', spinWheel);

    // 注意：因为默认display:none，canvas可能宽高为0，这里主要靠toggleLottery里的drawWheel来刷新
